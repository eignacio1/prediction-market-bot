[[factor]]
id = "B5"
factor_class = "NBA-5"
name = "Own injury status and teammates out (minutes / FGA vacated)"
source = "NBA official injury reports"
engine_slot = "availability"
stage = "interpreted"
evidence = "12_EXPLORATORY/nba_availability/results_W93_1.md"
# W93.1: status at last pre-tip report -> P(played): Out 0.0008, Questionable 0.514 [0.492, 0.536], Probable 0.919, Available 0.856 (n=23k listed rows, 2023-26); unlisted rotation players 0.762. Applied NOT reached: no 2026-27 event data and no pre-tip price history (GG-1420).
# Granularity index: split = last pre-tip status -> P(played), by season and lead; rank = not yet a column (needs same-point-in-season history);
# matchup cross = expected minus actual lineup (home-away); market map = total via expected pace/ptot, margin only via missing minutes;
# application = none (price and 2026-27 data gap, GG-1420).

[[factor]]
id = "B6"
factor_class = "NBA-6"
name = "Game-level availability (who is out for either side)"
source = "NBA official injury reports (coverage.json)"
engine_slot = "availability"
stage = "interpreted"
evidence = "12_EXPLORATORY/nba_availability/results_W93_1.md"
# W93.1: known-at-tip expected availability adds 0.307 MSE [-0.235, 0.829] beyond rotation (n=2008): does not move; expected missing minutes 2.641 [0.038, 5.082] is the one lead. Upper bound (who actually played) 0.956 [-0.674, 2.779]. Applied blocked, GG-1420.
# Granularity index: split = expected missing minutes by side; rank = not yet a column; matchup cross = home minus away missing minutes;
# market map = total and margin via rotation-weighted rating; application = none (GG-1420).

[[factor]]
id = "B7"
factor_class = "NBA-7"
name = "Lineup / on-off, play-type, matchup"
source = "src/prediction_market_bot/c1_signal_ingestion/nba_lineups.py (stints from sportsdataverse PBP + lineups, point-in-time)"
engine_slot = "player rating"
stage = "interpreted"
evidence = "12_EXPLORATORY/nba_lineups/results_W92_3.md"
# W92.3: interpreted on the TOTAL (held-out gain 4.04 MSE, CI 1.92-6.10, n=2008, survives prior-season carry); margin: no gain beyond prior-season carry (honest NO).
# Granularity index: split = on/off + rotation-weighted rel rating per 100 poss; rank = shrunk rating vs same point in prior seasons (not yet a column);
# matchup cross = home-away lineup diff, availability delta (played minus expected); market map = total via rotation pace/ptot, margin/spread only via availability delta;
# application = none (blocked on NBA price capture and availability feed GG-985; this season's Kalshi n~30-55, underpowered).

