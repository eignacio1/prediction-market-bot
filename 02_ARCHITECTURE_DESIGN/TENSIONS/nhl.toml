[meta]
sport = "nhl"
updated = "2026-11-11"
banner = "v0 DRAFT opened by a model from files on main (W109.2). Each tension names a file or gap that exists. Status OPEN means unrelieved, not unexamined."

[[tension]]
id = "NHL-T1"
title = "Totals: the engine under-predicts regulation goals in 2023-24 (sign flips by 2025) and the two fixes tried did not remove the bias or beat the baseline"
status = "OPEN"
where = "src/prediction_market_bot/nhl_engine/model.py price_games TOTAL lines 4.5/5.5/6.5"
evidence = "12_EXPLORATORY/nhl_engine/results/w101_1_heldout.json; 12_EXPLORATORY/nhl_engine/results/w109_2_totals.json"
pillar = "DEPTH (D5 applied) / PROOF"
relief = "Mean regulation-goal bias (predicted minus actual) held out 2023-2025 is -0.15, -0.10 and +0.01 by season: it is not stable in sign. W101.1 shrink gave -0.0008 Brier (pre-registered NO). W109.2 rest-state shift is gated out (stability CI includes 0 in every season) and ungated is -0.00007 [-0.00022, +0.00009]. Relief needs a factor that passes the stability gate, not a re-tune of the level."

[[tension]]
id = "NHL-T2"
title = "Deeper tree is not better for totals: full depth is worse than depth 2"
status = "OPEN"
where = "src/prediction_market_bot/nhl_engine/decision_tree.py depth 3 (goalie strength) vs depth 2"
evidence = "12_EXPLORATORY/nhl_engine/results/w109_2_totals.json; src/prediction_market_bot/nhl_engine/decision_tree.py"
pillar = "DEPTH (D5 decision_trees)"
relief = "Held out n=3,936 games: depth 3 minus depth 2 = +0.00061 TOTAL Brier [+0.00001, +0.00125] (worse, CI just clear of 0). The goalie-strength proxy adds noise to totals. Fix the goalie source (NHL-T3) before routing totals to depth 3; moneyline and puck line need their own depth ladder."

