# ==============================================================
# .pre-commit-config.yaml — Prediction Market Bot
# Purpose: Enforce code quality and security standards before commit
# See SECRETS_HANDLING.md (NFR-05) and NOTEBOOKS_POLICY.md
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
# ==============================================================

default_language_version:
  python: python3.11

repos:

  # --- Built-in hooks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # --- SECRETS SCAN (NFR-05: Zero hardcoded secrets) ---
  # CRITICAL: Must pass before any commit. Violation is a governance breach.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: .env.example

  # --- Code formatting (black) ---
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.11
        args: ['--line-length', '100']

  # --- Linting (flake8) ---
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']

  # --- Security linting (bandit) ---
  # Active from Phase 3+; catches common security anti-patterns
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        exclude: tests/

  # --- NOTEBOOK GUARD (see NOTEBOOKS_POLICY.md) ---
  # Notebooks must not contain output cells; strip before commit
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  # --- Type checking (mypy) ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies: ['types-all']
        args: ['--config-file', 'pyproject.toml']
        exclude: tests/
