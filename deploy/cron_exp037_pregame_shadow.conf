10 * * * * cd /opt/prediction-market-bot && export $(grep -v '^#' .env | xargs) && PYTHONPATH=/opt/prediction-market-bot/src:/opt/prediction-market-bot /opt/prediction-market-bot/venv/bin/python scripts/run_pregame_shadow.py --bands T2 >> logs/pregame_shadow_t2.log 2>&1
# T3 (15-60 min): every 10 min (window is 45 min wide).
*/10 * * * * cd /opt/prediction-market-bot && export $(grep -v '^#' .env | xargs) && PYTHONPATH=/opt/prediction-market-bot/src:/opt/prediction-market-bot /opt/prediction-market-bot/venv/bin/python scripts/run_pregame_shadow.py --bands T3 >> logs/pregame_shadow_t3.log 2>&1
