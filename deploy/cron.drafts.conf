# T-601 DRAFT -- NFL pre-kickoff capture of the extended nflverse allowlist.
# *** COMMENTED OUT. NOT INSTALLED. NOT AUTHORIZED. *** No authorization line
# naming this capture exists under "Needs your decision" (checked 2026-09-30).
# Install requires that line, then verification against the LIVE crontab
# (GG-262), not this file. Times are UTC (matches the price-archive lines above;
# confirm the VPS crontab TZ before install).
# Runner: scripts/nfl_prekickoff_capture.py (idempotent; appends only when the
# week-scoped content hash changes; refuses partial upstream data, exit 2).
# Lead-time basis (results summary T601 D1/D4): QB/coach/roof/surface appear
# upstream 9-34 days before kickoff, so early capture buys nothing; the
# perishable signal is the late QB/roof change, so captures sit 90-120 min
# before each kickoff cluster. Week 4 slate: Thu 00:15Z(Fri), Sun 13:30Z,
# 17:00Z, 20:05-20:25Z, Mon 00:20Z, Tue 00:15Z.
# Known gaps in this draft: Saturday-night games in weeks 15-17 and the
# single-slate week 18 (Sun 18:00Z) are not covered by the lines below.
#
# 0 18 * * 3   baseline ~30h before the Thursday game
# 30 22 * * 4  ~1h45 before Thursday night kickoff (Fri 00:15Z)
# 30 11 * * 0  ~2h before the 13:30Z international/early game
# 30 15 * * 0  ~90 min before the 17:00Z main slate
# 45 18 * * 0  ~80 min before the 20:05-20:25Z late slate
# 30 22 * * 0  ~1h50 before Sunday night (Mon 00:20Z)
# 30 22 * * 1  ~1h45 before Monday night (Tue 00:15Z)
# Full line form (apply to each time above):
# <min> <hr> * * <dow> cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON scripts/nfl_prekickoff_capture.py --accept-partial >> logs/nfl_prekickoff_capture_cron.log 2>&1
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# T-602 DRAFT -- archive self-sufficiency: settlement capture + dense depth capture.
# *** COMMENTED OUT. NOT INSTALLED. NOT AUTHORIZED. *** No authorization line
# naming these capture writers exists under "Needs your decision" (checked
# 2026-09-30). Install requires that line, then verification against the LIVE
# crontab (GG-262), not this file. Times UTC (as the price-archive lines above;
# confirm VPS crontab TZ before install). Both writers are new, read-only,
# unauthenticated, hold their own flock, and never touch PRICE_ARCHIVE.
#
# Settlement (scripts/capture_settlements.py): once daily at 09:30Z. Last MLB
# game ends ~05-06Z and the last NFL game (Mon night) ~04:30Z, so by 09:30Z the
# prior slate has settled. Incremental runs skip every ticker already stored
# (no fetch), so cost is a handful of bulk pages; only the one-off back-capture
# is large. More frequent runs add calls but no new information.
#
# Depth (scripts/capture_depth.py): hourly slot, 12 tickers/series x 14 series.
# Per run ~14 listing calls + ~168 orderbook calls = ~182 calls paced at 0.30s
# (~3.3 req/s, ~55s plus latency) vs the documented ~20 reads/s basic-tier
# budget (200 tokens/s at 10/req): ~17% of the budget while running, ~0.3%
# duty over an hour. Minute :10 collides with no existing line (price archive
# runs :00/:20/:40 and NFL :05/:25/:45), so T4M-PROJ's shared in-play read
# budget never sees two capture writers at once. Window 17-23Z and 00-05Z
# covers MLB first pitch to last out; NFL game series list empty outside NFL
# windows and are skipped at ~1 call each. Anonymous (no-auth) limits are
# undocumented: if any 429 appears in the log, halve --per-series first.
#
# 30 9 * * *      cd $PROJ && PYTHONPATH=$PYTHONPATH $PYTHON scripts/capture_settlements.py capture --archive exp_output/PRICE_ARCHIVE --store exp_output/SETTLEMENT_ARCHIVE >> logs/capture_settlements_cron.log 2>&1
# 10 17-23 * * *  cd $PROJ && PYTHONPATH=$PYTHONPATH $PYTHON scripts/capture_depth.py --store exp_output/DEPTH_ARCHIVE >> logs/capture_depth_cron.log 2>&1
# 10 0-5 * * *    cd $PROJ && PYTHONPATH=$PYTHONPATH $PYTHON scripts/capture_depth.py --store exp_output/DEPTH_ARCHIVE >> logs/capture_depth_cron.log 2>&1
