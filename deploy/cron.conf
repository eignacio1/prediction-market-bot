#   urgency framing is built on) -- kicks off 2026-09-10T03:20:00Z, which is
#   Thursday 03:20 UTC, not Friday. The 4-window design had NO Thursday
#   window at all and would have missed the season opener outright. Every
#   other event in the visible schedule (32 events checked) does fall
#   inside the original 4 windows: 25 Sun (hour 20 and 23), 2 Fri hour 3
#   (Thu-ET TNF spillover, e.g. SEP17DETBUF), 2 Mon hour 3 (SNF spillover),
#   2 Tue hour 3 (MNF spillover). Only the opener's Wed-ET-origin kickoff
#   falls outside that set. Added a 5th window (Thu 0-3Z) rather than
#   revising the other four, since they are independently confirmed correct
#   against live data -- this stays additive to itself, not just to MLB.
