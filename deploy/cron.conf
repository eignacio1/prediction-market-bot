# Prediction Market Bot — VPS Cron Configuration
# Install: crontab /opt/prediction-market-bot/deploy/cron.conf
# Timezone: All times are UTC. NBA games typically start 23:00–03:00 UTC (7pm–11pm ET).
#
# PIPE-02 pre-game inference: 17:55 UTC (1:55pm ET) — 5 min before primary PIPE-03 window.
#   Primary window moved 22:00→18:00 UTC (T-164/GG-014): server-side Kalshi congestion at
#   22:00 UTC basketball rush hour caused ~31% order failures (G5 confirmed). 18:00 UTC is
#   pre-rush (2pm ET); G5 01:00 UTC off-peak batch showed 0% failure rate confirming the
#   congestion is time-bound. Second PIPE-02 at 01:25 for the late window (unchanged).
# Health check: 17:00 UTC (1:00pm ET) — 55 min before primary pre-game run.
# PIPE-03 paper trading: 18:00 UTC and 01:30 UTC.
# Runs daily year-round; graceful exit if no markets available.

SHELL=/bin/bash
PROJ=/opt/prediction-market-bot
PYTHON=/opt/prediction-market-bot/venv/bin/python
PYTHONPATH=/opt/prediction-market-bot/src

# ---------------------------------------------------------------------------
# Pre-flight health check (17:00 UTC / 1:00pm ET)
# ---------------------------------------------------------------------------
0 17 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && bash deploy/healthcheck.sh >> logs/health.log 2>&1

# ---------------------------------------------------------------------------
# T-140 — TSS cache pre-flight check (17:25 UTC — 30 min before PIPE-02)
# Verifies team_stats_cache_{DATE}.json >= 1000 bytes; rebuilds via
# build_tss_cache.py if stale. PIPE-02 adj_lambda depends on this file.
# Exit 0 = OK, 1 = rebuilt, 2 = rebuild failed (PIPE-02 falls back to raw λ).
# ---------------------------------------------------------------------------
25 17 * * * cd $PROJ && $PYTHON scripts/run_t140_check.py >> logs/t140_cache_check.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-02 — Pre-game live inference: TWO windows (mirrors PIPE-03 timing)
#
#   17:55 UTC (1:55pm ET) — 5 min before primary PIPE-03 at 18:00 UTC
#   01:25 UTC (9:25pm ET) — 5 min before late PIPE-03 at 01:30 UTC
#
# Running immediately before each PIPE-03 window collapses the price-drift
# gap from 30 min to <5 min (KI-025 fix). Both runs are idempotent:
# pregame_YYYYMMDD.json is overwritten each time. PIPE-03 always fetches
# live Kalshi prices independently of the pregame snapshot.
# ---------------------------------------------------------------------------
55 17 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_pregame.py >> logs/pregame_cron.log 2>&1
25 1 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_pregame.py >> logs/pregame_late_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-03 — Paper trading: TWO windows to capture full game slate
#
#   18:00 UTC (2:00pm ET) — pre-game primary; pre-rush (T-164/GG-014 fix)
#   01:30 UTC (9:30pm ET) — pre-game for 9pm–10:30pm ET tip-offs (late games)
#
# Both windows are idempotent: ALL open positions (including failed-Kalshi)
# block re-entry on the same ticker (GG-028 fix, T-166). A player already in
# an open position will not be bet again on the same game date regardless of
# Kalshi order status. Full C4 risk engine active. BOT_ENV=paper guard prevents
# live capital.
#
# PAPER_YES_ONLY=true: EXP-018 YES-only diagnostic gate (S47 DS ruling,
# reaffirmed S56 as a continuous leg). NO signals are C6-logged as
# counterfactuals, not placed. Code default is also true; the explicit flag
# here is for operator visibility. Deactivation requires a DS ruling.
# ---------------------------------------------------------------------------
0 18 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper PAPER_YES_ONLY=true PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_paper_trade.py >> logs/paper_early_cron.log 2>&1
30 1 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper PAPER_YES_ONLY=true PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_paper_trade.py >> logs/paper_late_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-03R — Resolution-only run (06:00 UTC / 2:00am ET)
# Resolves open positions from late games that finished after 01:30 UTC.
# Does NOT place new bets. Safe to run at any time.
# ---------------------------------------------------------------------------
0 6 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_resolve.py >> logs/resolve_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-06 T3 Pre-tip momentum scan (*/15 UTC, covering 8pm–11pm ET game window)
# Two entries needed because cron hour-ranges cannot wrap midnight in a single expression.
# Kalshi is primary venue; T3 signals only require VenueRouter (Kalshi) — T-077 not a gate.
# Activated SESSION 34 (2026-06-05). cron.conf synced SESSION 38 (2026-06-08).
# ---------------------------------------------------------------------------
1,16,31,46 20-23 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_t3_pretip.py >> logs/t3_cron.log 2>&1
1,16,31,46 0-3  * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_t3_pretip.py >> logs/t3_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-06 T3 MLB Pre-tip momentum scan (*/15 UTC, covering 8pm–11pm ET + midnight wrap)
#
# Reads MLB T1 pregame context (pregame_mlb_YYYYMMDD.json from PIPE-06pre).
# Compares current KXMLBHIT prices to T1 snapshot → CONFIRM / FADE / NEUTRAL signal.
# Read-only — never places orders. Safe to run at any time.
#
# Two entries required: cron hour-ranges cannot wrap midnight in a single expression.
# MLB game window: 18:00–04:00 UTC (2pm–midnight ET). T3 begins 20:00 UTC
# (4pm ET, well before first pitch ~18:00 UTC) so it catches early price movement.
#
# GATE (S85 breach, fixed S87): S85 required T3 MLB cron before re-enabling MLB.
# S86 declared complete without adding these entries. Added S87.
# ---------------------------------------------------------------------------
# ENABLED — MLB-G1 gate closed (SESSION 90, 2026-06-27, T-199).
2,17,32,47 20-23 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_t3_mlb_pretip.py >> logs/t3_mlb_cron.log 2>&1
2,17,32,47 0-3   * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_t3_mlb_pretip.py >> logs/t3_mlb_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-07 — T4 in-play paper trading
#
#   23:00 UTC — covers full NBA game window (7pm–11pm ET = 23:00–03:00 UTC)
#   6h timeout (21600s) shuts down by 05:00 UTC if game runs long.
#   File-based kill switch: touch logs/t4_kill_switch.flag
#   Portfolio isolated to paper_portfolio_t4.json — does NOT touch T1 pool.
#   Budget: pool × T4_BAND_WEIGHT=0.27 (ADR-0023; ~$505 at G5 pool=$1,869).
#   Flat sizing: 1 contract/bet (hardcoded T4 paper policy — ADR-0023).
# ---------------------------------------------------------------------------
0 23 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper BOT_C4_ACTIVE=true PYTHONPATH=$PYTHONPATH timeout 21600 $PYTHON src/prediction_market_bot/run_t4_live.py >> logs/t4_live_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-06pre — MLB Pregame Context Generator (T-190 Step 1)
#
# Default schedule: 16:30 UTC (12:30pm ET).
#   Generates logs/pregame_mlb_YYYYMMDD.json: player → T1 forecast → KXMLBHIT ticker map.
#   Required by PIPE-06 T3 MLB (run_t3_mlb_pretip.py) and PIPE-07 T4 MLB (run_t4_mlb_live.py).
#   Read-only — never places orders. Safe to re-run at any time.
#
# DYNAMIC TIMING — MANAGED BY PIPE-08 MLB (08:30 UTC daily):
#   PIPE-08 adjusts this line in the LIVE CRONTAB each morning.
#   Default (16:30 UTC) is the cron.conf fallback; not the operational target.
#   Operational time = max(14:00 UTC, T4_start - 45min).
# ---------------------------------------------------------------------------
# ENABLED — MLB-G1 gate closed (SESSION 90, 2026-06-27, T-199).
45 18 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_mlb_pregame.py >> logs/pregame_mlb_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-05 — MLB Paper Trading (T-187D)
#
# Schedule: 11:00 UTC (7am ET) — Kalshi publishes same-day KXMLBHIT markets
#   by ~01:00 UTC. At 11:00 UTC all ET-dated games (first pitch ≥17:05 UTC)
#   are in "Preview" state — contamination guard always passes.
#   (T-196, S90: corrected from 03:00 UTC which targeted prior-day markets.)
#
# Prerequisites:
#   (1) models/mlb_v1_model.joblib
#   (2) exp_output/MLB/mlb_feature_matrix.csv
#   (3) logs/paper_portfolio_mlb.json — created automatically on first run
#
# Resolution: PIPE-05R (run_resolve_mlb.py — T-187E) at 06:30 UTC.
#
# MLB_PAPER_YES_ONLY=false: DS ruling SESSION 102 (2026-06-30) — gate rescinded.
#   NBA anti-predictive finding (edge>0 winrate 0.356) warrants unbiased MLB
#   paper record covering both YES and NO directions for EXP-017 validation.
# ---------------------------------------------------------------------------
# ENABLED — SESSION 94 T-204: ADR-0033 accepted; T4 live; full MLB arm active.
0 11 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper MLB_PAPER_YES_ONLY=false PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_mlb_paper_trade.py >> logs/paper_mlb_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-05.5 — MLB T2 Same-Day Batting Lineup Overlay (DS-04 MLB, T-191)
#
# Schedule: 19:30 UTC (3:30pm ET) — after most evening-game lineups posted.
#   Reads T1 pregame context (PIPE-06pre 16:30 UTC). Fetches confirmed batting
#   lineups via DS-04 MLB (MLB Stats API hydrate=lineups,team). Applies:
#     1. SCRATCH filter — players not in confirmed lineup are skipped.
#     2. Batting-slot Binomial adjustment — slot-specific AB multiplier → p_t2.
#     3. Per-game contamination guard — skips players in already-Live games.
#   Pool: paper_portfolio_mlb.json (shared with T1). Idempotency guard blocks
#   re-entry on tickers where T1 already has an open position.
#
# MLB_PAPER_YES_ONLY=false: DS ruling SESSION 102 (2026-06-30) — matches T1 change above.
# ---------------------------------------------------------------------------
# ENABLED — SESSION 94 T-204: ADR-0033 accepted; T4 live; full MLB arm active.
30 19 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper MLB_PAPER_YES_ONLY=false PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_t2_mlb_sameday.py >> logs/t2_mlb_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-07 MLB — T4 in-play paper trading (T-190 Step 3)
#
#   Default schedule: 13:00 UTC (9am ET) | timeout: 43200s (12h).
#   Cron fires early (before any MLB game can start). T4 startup self-heal fetches
#   live MLB schedule and sleeps until first_pitch - 30min. Crontab fire time is
#   irrelevant to actual evaluation start — the process self-corrects every run.
#   File-based kill switch: touch logs/t4_mlb_kill_switch.flag
#   Portfolio isolated to paper_portfolio_mlb_t4.json — does NOT touch T1 pool.
#   Budget: pool × T4_BAND_WEIGHT=0.27 (ADR-0023; ~$270 at $1,000 bankroll).
#   Flat sizing: 1 contract/bet (hardcoded T4 paper policy — ADR-0023).
#   Binomial model: P(hits >= threshold | h_so_far, ba_l10, ab_remaining)
#
# DYNAMIC TIMING — MANAGED BY PIPE-08 MLB (08:30 UTC daily):
#   PIPE-08 adjusts this line in the LIVE CRONTAB each morning to fire T4 closer
#   to first_pitch (saving idle process time). cron.conf default (13:00 UTC) is
#   the VPS-restart fallback — always fires before any game, self-heal corrects.
#   Operational time = max(15:00 UTC, first_pitch - 30min).
#   Operational timeout = (latest_game_start + 4h30m) - T4_start, min 3h.
# ---------------------------------------------------------------------------
# REPLACED BY SYSTEMD — SESSION 95 (2026-06-27).
# T4 MLB is now managed by deploy/t4-mlb.service + deploy/t4-mlb.timer.
# Restart=on-failure handles crashes; Persistent=true handles VPS-boot-after-missed-timer.
# Date-rollover refresh in main loop handles 24/7 operation across UTC midnight.
# This cron line is left here as a COMMENTED FALLBACK only — do not uncomment
# while the systemd service is active (would fire T4 twice on the same day).
# To reinstall: bash /opt/prediction-market-bot/deploy/install_systemd_t4_mlb.sh
#
# OLD CRON (now inactive):
# 0 13 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper BOT_C4_ACTIVE=true PYTHONPATH=$PYTHONPATH timeout 43200 $PYTHON src/prediction_market_bot/run_t4_mlb_live.py >> logs/t4_mlb_live_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-05R — MLB Paper Position Resolution (06:30 UTC)
#
# Schedule: 06:30 UTC — after all MLB games finish (West Coast games end
#   ~04:00–05:00 UTC; 90-min buffer). Resolves open positions in
#   paper_portfolio_mlb.json via MLB Stats API (statsapi.mlb.com).
#   Does NOT place new bets. Idempotent: safe to run multiple times.
#   API accessible from VPS for 2026; historical ≤2025 blocked (Fastly CDN).
# ---------------------------------------------------------------------------
# ENABLED — MLB-G1 gate closed (SESSION 90, 2026-06-27, T-199). Age-out guard live (T-194).
30 6 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_resolve_mlb.py >> logs/resolve_mlb_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-08 MLB — Daily Schedule Validator + Cron Adjuster (08:30 UTC)
#
# Schedule: 08:30 UTC (4:30am ET) — after resolution, 2.5h before T1.
# Source:   statsapi.mlb.com (official MLB API, no auth required)
#
# Pulls today's full MLB slate and dynamically adjusts PIPE-06pre and
# PIPE-07 MLB (T4) fire times in the LIVE CRONTAB based on actual first-pitch
# times. cron.conf is NOT modified — defaults below remain the git-managed
# fallback. On each fresh VPS deploy (git pull + crontab install), cron.conf
# defaults activate; PIPE-08 re-applies dynamic timing the next morning.
#
# What it adjusts (live crontab only):
#   PIPE-06pre: max(14:00 UTC, T4_start - 45min) — pregame before T4 needs it
#   PIPE-07 T4: max(15:00 UTC, first_pitch - 30min) — before earliest game
#   T4 timeout: (latest_game_start + 4h30m) - T4_start, min 3h
#
# What it GUARDS (logs warnings, does not adjust timing):
#   T1 (11:00 UTC): warns if any game starts within 90min of T1 fire
#   T2 (19:30 UTC): notes games that will be skipped by contamination guard
#   PIPE-05R (06:30 UTC): warns if any late game expected end > 06:30 UTC
#   Rain/suspension: flags active games in risk states for manual monitoring
#
# Outputs: logs/schedule_validation_YYYYMMDD.json (full slate + timing decisions)
#          logs/schedule_validator_mlb.log (append-only run log)
# ---------------------------------------------------------------------------
# ENABLED — SESSION 95 (2026-06-27).
30 8 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_schedule_validator_mlb.py >> logs/schedule_validator_mlb.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-05FX — MLB Feature Refresh (daily, --seasons 2026 only)
#
# Schedule: 22:30 UTC (6:30pm ET) — ~12.5h before PIPE-05 bet window (11:00 UTC next day).
# Purpose: refresh mlb_feature_matrix.csv with today's 2026 game data so that
#   run_mlb_paper_trade.py cohort lookup has current rolling features at bet time.
#
# IMPORTANT (MLB Stats API IP-blocking constraint — SESSION 81):
#   statsapi.mlb.com returns HTTP 406 for historical seasons (≤2025) from DigitalOcean
#   IPs. The --seasons 2026 flag restricts to the current season which IS accessible.
#   Historical data (2024/2025) was used for model TRAINING only (locally generated).
#   This daily VPS refresh OVERWRITES the feature CSV with 2026-only rows over time.
#   For annual retraining: generate full 3-season CSV locally, scp to VPS, retrain.
#
# The cache buster below deletes batter_logs and completed_games before each run
#   to force a fresh API pull for rolling batter stats. starters_2026.json and
#   pitcher_logs_2026.parquet are NOT busted: the hydrate=probablePitcher,venue,team
#   endpoint returns 406 from DO/Fastly for historical dates, so re-fetching always
#   produces an empty starters dict and destroys the locally-built SP cache. Preserve
#   the locally-built starters/pitcher cache from the annual training SCP workflow.
# ---------------------------------------------------------------------------
# ENABLED — MLB-G1 gate closed (SESSION 90, 2026-06-27, T-199).
# DISABLED W58.1/A5 (operator 2026-10-06 18:16 PT; GG-489): overwrote the good feature CSV nightly with degraded output; features now via GH Actions mlb_features_sync.
# 30 22 * * * cd $PROJ && rm -f exp_output/MLB/cache/batter_logs_2026.parquet exp_output/MLB/cache/completed_games_2026.parquet && PYTHONPATH=$PYTHONPATH $PYTHON scripts/generate_mlb_features.py --seasons 2026 >> logs/mlb_feature_refresh.log 2>&1

# ---------------------------------------------------------------------------
# Weekly model freshness check (Mondays 14:00 UTC / 10:00am ET)
# ---------------------------------------------------------------------------
0 14 * * 1 cd $PROJ && $PYTHON deploy/check_model_freshness.py >> logs/model_freshness.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-05C — MLB Calibration Monitor (Mondays 14:10 UTC — T-187F)
#
# Schedule: 10 minutes after model freshness check on Mondays.
# Reads closed positions from paper_portfolio_mlb.json.
# Computes ECE per threshold (t=1, t=2), derives recommended temperature T.
#
# Exit codes captured in cron log:
#   0 = CALIBRATED or insufficient data (< 50 closed positions per threshold)
#   1 = MISCALIBRATED — ECE > 0.05 on at least one threshold
#   2 = ANTI_PREDICTIVE — higher-edge bets losing at higher rate
#
# Does NOT write to calibration.py; temperature changes require an ADR.
# MIN_N_DIAGNOSE=50 per threshold; defers gracefully until data accumulates.
# ---------------------------------------------------------------------------
# ENABLED 2026-07-16 (ADR-0046/APR-0026/GG-044) — n=261 resolved MLB positions,
# well above MIN_N_DIAGNOSE=50 per threshold.
10 14 * * 1 cd $PROJ && PYTHONPATH=$PYTHONPATH $PYTHON scripts/run_mlb_calib_monitor.py >> logs/mlb_calib_monitor.log 2>&1

# ---------------------------------------------------------------------------
# T-255/T-257 — Per-Band Anti-Predictive + Calibration Monitor (GG-099)
#
# Schedule: Mondays 14:20 UTC — 10 min after PIPE-05C (weekly cadence matches
#   PIPE-05C; per-band n grows slowly enough that daily runs add no signal).
# Reads the band-tagged T1/T2/T3 book (T-253) plus the T4M-PROJ resolved
#   ledger (T-254, built fresh each run from the live VPS T4 book directly).
# Per band: Fisher edge-monotonicity (GG-037), calibration slope+CI, ECE,
#   EV/bet, $/staked. Bands under MIN_N=30 report UNDERPOWERED, never a
#   verdict (GG-098 lesson).
#
# --ci mode: exit 1 iff ANY band alarms ANTI-PREDICTIVE. WARN-ONLY — this is
#   a DS-review trigger, never an auto-kill (GG-098: a band-level halt is a
#   human decision). Exit codes captured in cron log only; nothing downstream
#   acts on them automatically.
#
# IMPORTANT — no --pull, explicit --portfolio paths (fixed 2026-07-08):
#   Both scripts' *default* paths (`.vps_portfolio_cache_*.json`, and
#   build_t4_resolved_ledger.py's `--pull`) exist for LOCAL dev-machine use,
#   where they ssh into this VPS to fetch a cache. Running with those
#   defaults ON the VPS itself is a no-op/crash: `--pull` shells out to
#   `ssh prediction-market-vps` from inside the VPS, and the plain default
#   cache file never exists here. Verified via manual dry-run (2026-07-08)
#   that the as-committed line crashes with FileNotFoundError every time —
#   caught before the first scheduled Monday fire. The live files ARE
#   already local here, so point directly at them, no pull needed.
# ---------------------------------------------------------------------------
20 14 * * 1 cd $PROJ && $PYTHON scripts/build_t4_resolved_ledger.py --portfolio logs/paper_portfolio_mlb_t4.json >> logs/band_monitor_cron.log 2>&1 && PYTHONPATH=$PYTHONPATH $PYTHON scripts/run_band_monitor.py --ci --portfolio logs/paper_portfolio_mlb.json >> logs/band_monitor_cron.log 2>&1

# ---------------------------------------------------------------------------
# Forward price archiver (Phase 0-E, T-410, 2026-08-01)
#
# Schedule: every 20 min, 22:00-05:00Z — covers the MLB in-play slate,
#   matching T4M-PROJ's live window. Two blocks needed: cron hour-ranges
#   cannot wrap midnight in a single expression.
#
# Purpose: no historical price archive existed for any MLB market family
#   before this (GG-15x, registered 2026-08-01). The only price history
#   anywhere was mid_price_at_entry/vig_at_entry on ledger rows -- bets
#   actually placed, a single family (KXMLBHIT), selection-biased. This
#   captures forward top-of-book snapshots for all 10 MLB families
#   read-only, append-only, one JSONL file per UTC day. Cannot be
#   backfilled once written -- every day this does not run is permanently
#   lost input to Phase 2's 2.7/2.8 market-comparison gate.
#
# Pacing floor (0.30s, enforced in-script) is a hard safety constraint:
#   T4M-PROJ shares the same production read budget during this exact
#   window. Raise --pause, never lower it, if T4 shows any degradation.
#
# --depth-sample-per-family 2 (Phase 0-H / T-412, 2026-08-04): GG-155 was a
#   measurement artifact from hand-sampling depth as a one-off point estimate;
#   T-411 found depth swings 14x in 14 minutes on one series and 67x between
#   two TEAM_TOTAL reads, so a point estimate cannot be trusted. This folds a
#   small, balanced (round-robin across series -- a single series can never
#   consume a family's whole sample, the GG-155 root cause) orderbook sample
#   into every run instead of continued hand-sampling. 6 families x 2 x 21
#   runs/day comfortably clears the 200 observations/family/week target
#   within days. Additive request volume on top of the price fetch -- raise
#   the count only after confirming T4M-PROJ shows no degradation.
# ---------------------------------------------------------------------------
*/20 22-23 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON scripts/archive_market_prices.py --series KXMLBGAME KXMLBSPREAD KXMLBTOTAL KXMLBTEAMTOTAL KXMLBF3 KXMLBF5 KXMLBF7 KXMLBF5SPREAD KXMLBF5TOTAL KXMLBHIT --out exp_output/PRICE_ARCHIVE --depth-sample-per-family 2 >> logs/price_archive_cron.log 2>&1
*/20 0-5   * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON scripts/archive_market_prices.py --series KXMLBGAME KXMLBSPREAD KXMLBTOTAL KXMLBTEAMTOTAL KXMLBF3 KXMLBF5 KXMLBF7 KXMLBF5SPREAD KXMLBF5TOTAL KXMLBHIT --out exp_output/PRICE_ARCHIVE --depth-sample-per-family 2 >> logs/price_archive_cron.log 2>&1

# ---------------------------------------------------------------------------
# Forward price archiver — NFL addition (GG-245, T-521, 2026-09-05)
#
# Gap: this file captured MLB-only. Zero KXNFL rows exist in any archive file
#   through 2026-09-05, and the 2026 NFL season opens 2026-09-09. Like the
#   MLB gap above, this data cannot be backfilled once a day passes uncaptured.
#
# Series live-verified against the public Kalshi markets endpoint (no auth
#   required) on 2026-09-05, same day this was added -- do not trust ADR-0062's
#   2026-09-01 snapshot instead of a fresh check:
#     KXNFLGAME       -- 64 open markets
#     KXNFLSPREAD     -- 200+ open markets
#     KXNFLTOTAL      -- 200+ open markets
#     KXNFLTEAMTOTAL  -- 55 open markets (ADR-0062 found this "structurally
#                        real but currently unlisted for this season" on
#                        2026-09-01; it is listing now -- ADR-0062's snapshot
#                        is stale, this line is current fact as of 2026-09-05)
#
# Schedule: NFL does not play in the MLB windows above (22-23Z, 0-5Z daily).
#   CORRECTION (same session, 2026-09-05, post-deploy live-schedule audit):
#   the original 4-window design below was built from a generic NFL-week
#   assumption (Sun/SNF/MNF/TNF) and was NOT checked against this season's
