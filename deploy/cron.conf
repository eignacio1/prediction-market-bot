# Prediction Market Bot — VPS Cron Configuration
# Install: crontab /opt/prediction-market-bot/deploy/cron.conf
# Timezone: All times are UTC. NBA games typically start 23:00–03:00 UTC (7pm–11pm ET).
#
# PIPE-02 pre-game inference: 17:55 UTC (1:55pm ET) — 5 min before primary PIPE-03 window.
#   Primary window moved 22:00→18:00 UTC (T-164/GG-014): server-side Kalshi congestion at
#   22:00 UTC basketball rush hour caused ~31% order failures (G5 confirmed). 18:00 UTC is
#   pre-rush (2pm ET); G5 01:00 UTC off-peak batch showed 0% failure rate confirming the
#   congestion is time-bound. Second PIPE-02 at 01:25 for the late window (unchanged).
# Health check: 17:00 UTC (1:00pm ET) — 55 min before primary pre-game run.
# PIPE-03 paper trading: 18:00 UTC and 01:30 UTC.
# Runs daily year-round; graceful exit if no markets available.

SHELL=/bin/bash
PROJ=/opt/prediction-market-bot
PYTHON=/opt/prediction-market-bot/venv/bin/python
PYTHONPATH=/opt/prediction-market-bot/src

# ---------------------------------------------------------------------------
# Pre-flight health check (17:00 UTC / 1:00pm ET)
# ---------------------------------------------------------------------------
0 17 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && bash deploy/healthcheck.sh >> logs/health.log 2>&1

# ---------------------------------------------------------------------------
# T-140 — TSS cache pre-flight check (17:25 UTC — 30 min before PIPE-02)
# Verifies team_stats_cache_{DATE}.json >= 1000 bytes; rebuilds via
# build_tss_cache.py if stale. PIPE-02 adj_lambda depends on this file.
# Exit 0 = OK, 1 = rebuilt, 2 = rebuild failed (PIPE-02 falls back to raw λ).
# ---------------------------------------------------------------------------
25 17 * * * cd $PROJ && $PYTHON scripts/run_t140_check.py >> logs/t140_cache_check.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-02 — Pre-game live inference: TWO windows (mirrors PIPE-03 timing)
#
#   17:55 UTC (1:55pm ET) — 5 min before primary PIPE-03 at 18:00 UTC
#   01:25 UTC (9:25pm ET) — 5 min before late PIPE-03 at 01:30 UTC
#
# Running immediately before each PIPE-03 window collapses the price-drift
# gap from 30 min to <5 min (KI-025 fix). Both runs are idempotent:
# pregame_YYYYMMDD.json is overwritten each time. PIPE-03 always fetches
# live Kalshi prices independently of the pregame snapshot.
# ---------------------------------------------------------------------------
55 17 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_pregame.py >> logs/pregame_cron.log 2>&1
25 1 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_pregame.py >> logs/pregame_late_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-03 — Paper trading: TWO windows to capture full game slate
#
#   18:00 UTC (2:00pm ET) — pre-game primary; pre-rush (T-164/GG-014 fix)
#   01:30 UTC (9:30pm ET) — pre-game for 9pm–10:30pm ET tip-offs (late games)
#
# Both windows are idempotent: ALL open positions (including failed-Kalshi)
# block re-entry on the same ticker (GG-028 fix, T-166). A player already in
# an open position will not be bet again on the same game date regardless of
# Kalshi order status. Full C4 risk engine active. BOT_ENV=paper guard prevents
# live capital.
#
# PAPER_YES_ONLY=true: EXP-018 YES-only diagnostic gate (S47 DS ruling,
# reaffirmed S56 as a continuous leg). NO signals are C6-logged as
# counterfactuals, not placed. Code default is also true; the explicit flag
# here is for operator visibility. Deactivation requires a DS ruling.
# ---------------------------------------------------------------------------
0 18 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper PAPER_YES_ONLY=true PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_paper_trade.py >> logs/paper_early_cron.log 2>&1
30 1 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper PAPER_YES_ONLY=true PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_paper_trade.py >> logs/paper_late_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-03R — Resolution-only run (06:00 UTC / 2:00am ET)
# Resolves open positions from late games that finished after 01:30 UTC.
# Does NOT place new bets. Safe to run at any time.
# ---------------------------------------------------------------------------
0 6 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_resolve.py >> logs/resolve_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-06 T3 Pre-tip momentum scan (*/15 UTC, covering 8pm–11pm ET game window)
# Two entries needed because cron hour-ranges cannot wrap midnight in a single expression.
# Kalshi is primary venue; T3 signals only require VenueRouter (Kalshi) — T-077 not a gate.
# Activated SESSION 34 (2026-06-05). cron.conf synced SESSION 38 (2026-06-08).
# ---------------------------------------------------------------------------
*/15 20-23 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_t3_pretip.py >> logs/t3_cron.log 2>&1
*/15 0-3  * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_t3_pretip.py >> logs/t3_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-07 — T4 in-play paper trading
#
#   23:00 UTC — covers full NBA game window (7pm–11pm ET = 23:00–03:00 UTC)
#   6h timeout (21600s) shuts down by 05:00 UTC if game runs long.
#   File-based kill switch: touch logs/t4_kill_switch.flag
#   Portfolio isolated to paper_portfolio_t4.json — does NOT touch T1 pool.
#   Budget: pool × T4_BAND_WEIGHT=0.27 (ADR-0023; ~$505 at G5 pool=$1,869).
#   Flat sizing: 1 contract/bet (hardcoded T4 paper policy — ADR-0023).
# ---------------------------------------------------------------------------
0 23 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper BOT_C4_ACTIVE=true PYTHONPATH=$PYTHONPATH timeout 21600 $PYTHON src/prediction_market_bot/run_t4_live.py >> logs/t4_live_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-05 — MLB Paper Trading (T-187D)
#
# Schedule: 23:30 UTC (7:30pm ET) — after NBA T1 primary window (18:00 UTC)
#   and well before MLB game finishes (most finish by 03:00–04:00 UTC).
#   Single window: MLB games start 18:00–23:00 UTC (2pm–7pm ET); T1 bets
#   are pre-game only. A second window (late West Coast games) can be added
#   once MLB game-in-progress check is validated in production.
#
# Prerequisites before activating:
#   (1) models/mlb_v1_model.joblib — run scripts/train_mlb_model.py (T-187B)
#   (2) exp_output/MLB/mlb_feature_matrix.csv — run scripts/generate_mlb_features.py (T-187A)
#   (3) logs/paper_portfolio_mlb.json — created automatically on first run
#
# Resolution: MLB positions are settled by PIPE-05R (run_resolve_mlb.py — T-187E).
#
# MLB_PAPER_YES_ONLY=true: mirrors NBA PAPER_YES_ONLY gate until directional
#   edge data exists (DS directive required to disable).
# ---------------------------------------------------------------------------
# PAUSED — S85: MLB arm incomplete (T4 unbuilt). Do not re-enable until full MLB component audit passes.
# 30 23 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper MLB_PAPER_YES_ONLY=true PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_mlb_paper_trade.py >> logs/paper_mlb_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-05R — MLB Paper Position Resolution (06:30 UTC)
#
# Schedule: 06:30 UTC — after all MLB games finish (West Coast games end
#   ~04:00–05:00 UTC; 90-min buffer). Resolves open positions in
#   paper_portfolio_mlb.json via MLB Stats API (statsapi.mlb.com).
#   Does NOT place new bets. Idempotent: safe to run multiple times.
#   API accessible from VPS for 2026; historical ≤2025 blocked (Fastly CDN).
# ---------------------------------------------------------------------------
# PAUSED — S85: MLB arm incomplete. Re-enable with PIPE-05 once full arm is built.
# 30 6 * * * cd $PROJ && export $(grep -v '^#' .env | xargs) && BOT_ENV=paper PYTHONPATH=$PYTHONPATH $PYTHON src/prediction_market_bot/run_resolve_mlb.py >> logs/resolve_mlb_cron.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-05FX — MLB Feature Refresh (daily, --seasons 2026 only)
#
# Schedule: 22:30 UTC (6:30pm ET) — 1 hour before PIPE-05 bet window (23:30).
# Purpose: refresh mlb_feature_matrix.csv with today's 2026 game data so that
#   run_mlb_paper_trade.py cohort lookup has current rolling features at bet time.
#
# IMPORTANT (MLB Stats API IP-blocking constraint — SESSION 81):
#   statsapi.mlb.com returns HTTP 406 for historical seasons (≤2025) from DigitalOcean
#   IPs. The --seasons 2026 flag restricts to the current season which IS accessible.
#   Historical data (2024/2025) was used for model TRAINING only (locally generated).
#   This daily VPS refresh OVERWRITES the feature CSV with 2026-only rows over time.
#   For annual retraining: generate full 3-season CSV locally, scp to VPS, retrain.
#
# The cache buster below deletes batter_logs and completed_games before each run
#   to force a fresh API pull for rolling batter stats. starters_2026.json and
#   pitcher_logs_2026.parquet are NOT busted: the hydrate=probablePitcher,venue,team
#   endpoint returns 406 from DO/Fastly for historical dates, so re-fetching always
#   produces an empty starters dict and destroys the locally-built SP cache. Preserve
#   the locally-built starters/pitcher cache from the annual training SCP workflow.
# ---------------------------------------------------------------------------
# PAUSED — S85: MLB arm incomplete. Re-enable with PIPE-05 once full arm is built.
# 30 22 * * * cd $PROJ && rm -f exp_output/MLB/cache/batter_logs_2026.parquet exp_output/MLB/cache/completed_games_2026.parquet && PYTHONPATH=$PYTHONPATH $PYTHON scripts/generate_mlb_features.py --seasons 2026 >> logs/mlb_feature_refresh.log 2>&1

# ---------------------------------------------------------------------------
# Weekly model freshness check (Mondays 14:00 UTC / 10:00am ET)
# ---------------------------------------------------------------------------
0 14 * * 1 cd $PROJ && $PYTHON deploy/check_model_freshness.py >> logs/model_freshness.log 2>&1

# ---------------------------------------------------------------------------
# PIPE-05C — MLB Calibration Monitor (Mondays 14:10 UTC — T-187F)
#
# Schedule: 10 minutes after model freshness check on Mondays.
# Reads closed positions from paper_portfolio_mlb.json.
# Computes ECE per threshold (t=1, t=2), derives recommended temperature T.
#
# Exit codes captured in cron log:
#   0 = CALIBRATED or insufficient data (< 50 closed positions per threshold)
#   1 = MISCALIBRATED — ECE > 0.05 on at least one threshold
#   2 = ANTI_PREDICTIVE — higher-edge bets losing at higher rate
#
# Does NOT write to calibration.py; temperature changes require an ADR.
# MIN_N_DIAGNOSE=50 per threshold; defers gracefully until data accumulates.
# ---------------------------------------------------------------------------
# PAUSED — S85: MLB arm incomplete. Re-enable with PIPE-05 once full arm is built.
# 10 14 * * 1 cd $PROJ && PYTHONPATH=$PYTHONPATH $PYTHON scripts/run_mlb_calib_monitor.py >> logs/mlb_calib_monitor.log 2>&1
