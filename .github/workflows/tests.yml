name: Test Suite

# T-337 (N-02): before this workflow, no CI job ran pytest at all — the
# repo had deploy.yml, post_game_resolve.yml, and tss_daily_sync.yml, none
# of which touch tests/. The full ~2,400-test suite (2,494 collected /
# 2,465 passed + 29 skipped as of 2026-07-11, T-337 certification run,
# 120.75s on real hardware) was ad-hoc-only: it ran only when a session
# happened to invoke it manually, and the sandbox's ~45s wall time could
# not even complete it. Since a full-suite run had never been gated on
# push, a regression could land on main undetected until the next
# session happened to run pytest by hand. This workflow closes that gap:
# every push and PR against main now runs the complete suite (tests/,
# which includes test_band_monitor.py and test_power_calc.py — the two
# files T-337 named explicitly — with no separate include needed since
# pytest's testpaths in pyproject.toml already covers the whole
# directory).
#
# Uses the pinned lockfile (06_CODE_EXECUTION_REPRODUCIBILITY/DEPENDENCY_LOCKS/
# requirements-dev.txt), not floating pyproject.toml ranges, so CI installs
# the exact versions this suite was certified green against.
#
# T-399 (2026-07-29): paths-ignore added below. 693 commits landed on main
# in July 2026; 474 of them (68%) touched none of src/, tests/, scripts/,
# or pyproject.toml — pure 03_DECISIONS/, 04_EXECUTION/, 11_MEMORY_HANDOFF/
# governance-nav-file traffic (SESSION_CLAIMS.md rows, DECISION_LOG.md
# entries, checkpoint pointers — exactly what Hard Rule 7/10's
# commit-early-and-often protocol is supposed to produce). Every one of
# those was still running the full ~4min suite. Verified before adding this
# list: (1) grep across src/ confirms every reference to these directories
# is a "See X.md" comment/docstring pointer, never a runtime file read: (2)
# grep across tests/ confirms the only hits (test_write_session_checkpoint.py,
# test_session_guard_checkpoint_staleness.py, test_claim_session_collision.py)
# use "04_EXECUTION" only as a directory name inside an isolated pytest
# tmp_path fixture, exercising the scripts/ + .claude/hooks/ logic, not the
# real repo's file content — so a doc-only edit to the real SESSION_CLAIMS.md
# does not change what these tests exercise. paths-ignore is a denylist, not
# an allowlist: any commit touching a path outside this list (including
# .claude/, CLAUDE.md, and every code root) still runs the full suite
# unconditionally. Deliberately NOT included: CLAUDE.md and .claude/**
# (session_guard.sh/claim_session.sh logic lives there and IS exercised by
# the tests above) — kept always-triggering out of caution even though no
# runtime dependency was found.

on:
  push:
    branches: [main]
    paths-ignore:
      - '03_DECISIONS/**'
      - '04_EXECUTION/**'
      - '11_MEMORY_HANDOFF/**'
      - '00_ADMIN/**'
      - '02_ARCHITECTURE_DESIGN/**'
      - '05_RESEARCH_EXPERIMENTS/**'
      - '07_TEST_VALIDATION_EVIDENCE/**'
      - '08_MODEL_RISK_GOVERNANCE/**'
      - '01_SPEC/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '03_DECISIONS/**'
      - '04_EXECUTION/**'
      - '11_MEMORY_HANDOFF/**'
      - '00_ADMIN/**'
      - '02_ARCHITECTURE_DESIGN/**'
      - '05_RESEARCH_EXPERIMENTS/**'
      - '07_TEST_VALIDATION_EVIDENCE/**'
      - '08_MODEL_RISK_GOVERNANCE/**'
      - '01_SPEC/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 06_CODE_EXECUTION_REPRODUCIBILITY/DEPENDENCY_LOCKS/requirements-dev.txt
          pip install -e .

      - name: Run full test suite
        env:
          # GG-179/T-464: lets the 10 CSV-only tests in tests/integration/
          # (no Kalshi credentials needed) run against a synthesized
          # feature CSV instead of silently skipping — see
          # tests/integration/conftest.py's feature_csv_path fixture.
          MLB_CI_SYNTHETIC_FIXTURE: "1"
        run: pytest tests/ -q -rs --junit-xml=pytest-results.xml

      # GG-179/T-464: bare pytest's summary line reports a skip count but
      # nothing gates on it, so a test silently skipping in CI forever is
      # indistinguishable from a passing test. This fails the build if the
      # skip count exceeds the known baseline (see check_skip_ceiling.py's
      # docstring and GG-179 for the current baseline's derivation) and
      # prints every skip's name+reason either way so a new one is visible
      # in the CI log, not just in a collapsed summary line.
      - name: Enforce skip ceiling (GG-179)
        if: always()
        run: python3 scripts/testing/check_skip_ceiling.py pytest-results.xml --ceiling 18
