name: MLB Features Sync

# W57.1 / GG-489. statsapi.mlb.com answers the VPS with 406 (GG-470) and the VPS 22:30 PIPE-05FX cron
# passes no --include-postseason, so after the regular season ended (2026-09-27) the feature CSV
# stopped advancing and T1/PIPE-06pre HALTed on staleness_halt. The CSV is regenerated HERE (runner
# egress, regular season + postseason), gated by the unchanged MLB_FEATURE_CSV_CONTRACT, then pushed
# to the VPS atomically. Fail-closed: any step failing exits non-zero and leaves the VPS CSV untouched.
# Schedule: 23:17 UTC lands after the VPS 22:30 cron (which overwrites the CSV with its degraded
# regular-season-only output) and 10:17 UTC re-asserts before PIPE-05 at 11:00. Minutes miss :00/:30 (GG-477).
# Required secret: VPS_SSH_KEY. Touches no file t4-mlb imports and writes no ledger.

on:
  schedule:
    - cron: '17 23 * * *'
    - cron: '17 10 * * *'
  workflow_dispatch:

concurrency:
  group: mlb-features-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VPS: root@157.230.91.33
      REMOTE: /opt/prediction-market-bot/exp_output/MLB
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 06_CODE_EXECUTION_REPRODUCIBILITY/DEPENDENCY_LOCKS/requirements-dev.txt
          pip install -e .

      - name: Generate features (regular season + postseason)
        run: python scripts/generate_mlb_features.py --seasons 2026 --include-postseason

      - name: Gate on the unchanged data contract (fail-closed)
        run: python scripts/verify_mlb_feature_csv.py exp_output/MLB/mlb_feature_matrix.csv --meta-out exp_output/MLB/mlb_feature_matrix.meta.json

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 157.230.91.33 >> ~/.ssh/known_hosts

      - name: Push to the VPS (tmp + atomic mv)
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key exp_output/MLB/mlb_feature_matrix.csv "$VPS:$REMOTE/mlb_feature_matrix.csv.tmp"
          scp -i ~/.ssh/vps_key exp_output/MLB/mlb_feature_matrix.meta.json "$VPS:$REMOTE/mlb_feature_matrix.meta.json.tmp"
          ssh -i ~/.ssh/vps_key "$VPS" "cd $REMOTE && mv mlb_feature_matrix.csv.tmp mlb_feature_matrix.csv && mv mlb_feature_matrix.meta.json.tmp mlb_feature_matrix.meta.json"
          echo "synced $(cat exp_output/MLB/mlb_feature_matrix.meta.json)" | tee -a "$GITHUB_STEP_SUMMARY"
