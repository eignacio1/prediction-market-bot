name: Deploy to VPS

# Automatically deploys the main branch to the VPS on every push.
# T-171 (untracking paper_portfolio.json from git) shipped 2026-06-15 — this
# workflow has been live since. The comment above previously said "do not
# activate before T-171" and was stale for three weeks (GG-073).
#
# GG-073/GG-102: the original dirty-tree guard checked `git status --porcelain`
# with NO --untracked-files flag, so it aborted on ANY untracked file — not
# just tracked-file modifications. The VPS constantly accumulates new
# untracked runtime output (new exp_output/<EXP-ID>/ dirs, pipeline caches,
# scratch files) as new components ship, so this guard required perpetual
# whack-a-mole .gitignore additions and regressed repeatedly (100% failure
# 2026-06-12→07-03, fixed, then failed again by 2026-07-08). The guard below
# checks TRACKED-file modifications only (--untracked-files=no) — the actual
# invariant T-171 needs (don't let `git pull` clobber a locally-modified
# tracked file) without caring about new untracked scratch output. New
# pipeline/experiment output no longer needs an individual .gitignore entry
# just to keep deploys green.
#
# Required GitHub Actions secret: VPS_SSH_KEY (private key for root@157.230.91.33)
# Same secret as post_game_resolve.yml and tss_daily_sync.yml.
#
# T-327 (Workstream C3, 2026-07-10): the `approval-path-tests` job below is a
# fail-closed pre-deploy gate. It always runs the GG-087/GG-077 property suite
# (tests/test_approval_path_invariants.py) and golden-replay harness
# (tests/test_golden_replay.py) and `deploy` depends on it via `needs:` — a red
# run blocks deploy outright. It runs on every push rather than being
# path-filtered to paper_trader.py/run_*_paper_trade.py/run_t4_mlb_live.py/
# risk.py: a git-diff path filter is itself an untested guard that can silently
# under-match (see GG-073/GG-102 in the comment above — this repo has already
# shipped one buggy dirty-tree guard of exactly this shape). Both suites run in
# ~8s combined, so always-on has no meaningful cost and removes an entire class
# of "the filter didn't fire" failure mode for the one gate this workstream
# exists to add.
#
# T-399 (2026-07-29): the paths-ignore below is a DIFFERENT shape of filter
# from the one T-327 rejected above, not a contradiction of it. T-327 ruled
# out an allowlist keyed to specific risk-critical code paths (paper_trader.py,
# risk.py, etc.) because an under-match there silently skips the one gate that
# exists to catch a bad risk-path change — the failure mode is invisible and
# dangerous. This is a denylist of verified-non-code governance directories
# (03_DECISIONS/, 04_EXECUTION/, 11_MEMORY_HANDOFF/, etc. — see tests.yml's
# T-399 comment for the verification: no src/ runtime read, no test outside
# an isolated tmp_path fixture depends on their real content). Any file
# outside this list, including every code path and CLAUDE.md/.claude/,
# still triggers the full gate + deploy unconditionally — the failure mode
# of an under-broad denylist is "ran CI/deploy when it wasn't strictly
# needed" (cost), never "skipped the gate on a risk-relevant change".
# Driver: 693 commits landed on main in July 2026, 474 (68%) touching none
# of src/tests/scripts/pyproject.toml — pure SESSION_CLAIMS.md/DECISION_LOG.md
# nav-file traffic from the Hard Rule 7/10 commit-early-and-often protocol,
# each one still running a full deploy+service-restart cycle for zero reason.

on:
  push:
    branches: [main]
    paths-ignore:
      - '03_DECISIONS/**'
      - '04_EXECUTION/**'
      - '11_MEMORY_HANDOFF/**'
      - '00_ADMIN/**'
      - '02_ARCHITECTURE_DESIGN/**'
      - '05_RESEARCH_EXPERIMENTS/**'
      - '07_TEST_VALIDATION_EVIDENCE/**'
      - '08_MODEL_RISK_GOVERNANCE/**'
      - '01_SPEC/**'
  workflow_dispatch:

jobs:
  approval-path-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 06_CODE_EXECUTION_REPRODUCIBILITY/DEPENDENCY_LOCKS/requirements-dev.txt
          pip install -e .

      - name: Run approval-path invariant + golden-replay suites
        run: |
          pytest -v tests/test_approval_path_invariants.py tests/test_golden_replay.py

  deploy:
    needs: approval-path-tests
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519_droplet
          chmod 600 ~/.ssh/id_ed25519_droplet
          ssh-keyscan -H 157.230.91.33 >> ~/.ssh/known_hosts

      - name: Deploy
        # GG-130 (2026-07-22): dirty-tree guard, generalized fix for the
        # GG-073/GG-102/GG-104/GG-117 incident class. Every one of those four
        # prior incidents was the same shape: a cron/pipeline job on the VPS
        # writes into a path that is (or later became) git-tracked, this guard
        # sees a modified tracked file, and the deploy hard-fails. Each was
        # patched one filename at a time via .gitignore -- whack-a-mole against
        # the symptom, not a fix to the class of bug (see
        # 03_DECISIONS/GOVERNANCE_GAP_LOG.md GG-130 for the full incident
        # history this generalizes).
        #
        # Fix: any TRACKED file modified under a known regenerated-output root
        # (exp_output/, data/, logs/, models/ — everything deploy/cron.conf's
        # scheduled jobs write into) is auto-reset to the committed version
        # before pulling. The VPS is never the source of truth for tracked
        # content — a legitimate change to a tracked file should land via a
        # commit through the normal dev workflow, not by mutating in place on
        # the box. Anything modified OUTSIDE those roots still hard-fails,
        # preserving the original T-171 protection against a real source/config
        # file being hand-edited on the VPS.
        #
        # Piped via `bash -s` heredoc rather than embedded as a single quoted
        # SSH argument (the prior style) so the guard logic is real, readable,
        # testable bash instead of an escaped one-liner — and so it always runs
        # the current version straight from this workflow file with no
        # bootstrap dependency on the VPS already having pulled it.
        #
        # Full incident writeup + what to do if this step still fails:
        # 10_INFRA_OPERATIONS/RUNBOOKS/RUNBOOK_deploy-dirty-tree.md
        run: |
          ssh -i ~/.ssh/id_ed25519_droplet \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              root@157.230.91.33 'bash -s' <<'REMOTE_DEPLOY'
          set -euo pipefail
          cd /opt/prediction-market-bot

          REGEN_ROOTS=(exp_output/ data/ logs/ models/)

          DIRTY="$(git status --porcelain --untracked-files=no 2>/dev/null || true)"

          if [ -n "$DIRTY" ]; then
            HEALED=()
            UNEXPECTED=()
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              fpath="${line:3}"
              matched=0
              for root in "${REGEN_ROOTS[@]}"; do
                case "$fpath" in
                  "$root"*) matched=1 ;;
                esac
              done
              if [ "$matched" -eq 1 ]; then
                git checkout -- "$fpath"
                HEALED+=("$fpath")
              else
                UNEXPECTED+=("$line")
              fi
            done <<< "$DIRTY"

            if [ "${#HEALED[@]}" -gt 0 ]; then
              echo "AUTO-HEALED (GG-130): tracked files under a known cron-output root were reset to the committed version before pulling:"
              printf '  - %s\n' "${HEALED[@]}"
            fi

            if [ "${#UNEXPECTED[@]}" -gt 0 ]; then
              echo "ERROR: VPS has local modifications to TRACKED files outside known cron-output roots (${REGEN_ROOTS[*]}) -- git pull aborted to avoid clobbering them."
              echo "This means a file already committed to the repo (source, config, docs, or a deliberately-tracked snapshot) was edited in place on the VPS."
              echo "Investigate and either commit/discard the change on the VPS, or move it to a gitignored path if it is genuinely regenerable runtime state."
              printf '  %s\n' "${UNEXPECTED[@]}"
              exit 1
            fi
          fi

          git pull --ff-only origin main
          REMOTE_DEPLOY

      - name: Restart persistent services (T-328/GG-104)
        # GG-104: a successful `git pull` only proves code-on-disk updated —
        # it says nothing about whether the long-running systemd services
        # reading that code actually picked it up. This left t4-mlb running
        # a stale paper_trader.py for ~2 days after the T-320/T-321 merge,
        # caught only by manual inspection. Restart unconditionally on every
        # deploy so staleness can no longer survive silently.
        run: |
          ssh -i ~/.ssh/id_ed25519_droplet \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              root@157.230.91.33 \
              "systemctl restart t4-mlb pmbot-web-dashboard"

      - name: Verify HEAD and service freshness
        run: |
          ssh -i ~/.ssh/id_ed25519_droplet \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              root@157.230.91.33 \
              "cd /opt/prediction-market-bot && \
               echo '--- VPS HEAD ---' && git log -1 --oneline && \
               PULL_EPOCH=\$(date +%s) && \
               for svc in t4-mlb pmbot-web-dashboard; do \
                 ACTIVE_TS=\$(systemctl show \"\$svc\" --property=ActiveEnterTimestamp --value); \
                 ACTIVE_EPOCH=\$(date -d \"\$ACTIVE_TS\" +%s 2>/dev/null || echo 0); \
                 echo \"--- \$svc ActiveEnterTimestamp: \$ACTIVE_TS ---\"; \
                 if [ \"\$ACTIVE_EPOCH\" -lt \"\$((PULL_EPOCH - 120))\" ]; then \
                   echo \"ERROR: \$svc did not restart within the last 2 minutes — deploy did not take effect on the running process.\"; \
                   exit 1; \
                 fi; \
               done"
