name: Deploy to VPS

# Automatically deploys the main branch to the VPS on every push.
# Part of T-171: ships as ONE UNIT with untracking paper_portfolio.json from git.
# Do NOT activate this workflow before T-171 migration is complete —
# git pull on a VPS with a dirty (git-tracked) portfolio file will abort.
#
# Required GitHub Actions secret: VPS_SSH_KEY (private key for root@157.230.91.33)
# Same secret as post_game_resolve.yml and tss_daily_sync.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519_droplet
          chmod 600 ~/.ssh/id_ed25519_droplet
          ssh-keyscan -H 157.230.91.33 >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519_droplet \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              root@157.230.91.33 \
              "cd /opt/prediction-market-bot && \
               DIRTY=\$(git status --porcelain 2>/dev/null); \
               if [ -n \"\$DIRTY\" ]; then \
                 echo 'WARNING: VPS working tree is dirty — T-171 migration not yet complete.'; \
                 echo 'Tracked portfolio files are being written by cron. git pull aborted.'; \
                 echo 'Run T-171 migration (see TODO_NEXT.md #13) then re-push.'; \
                 echo \"Dirty files: \$DIRTY\"; \
                 exit 1; \
               fi && \
               git pull origin main 2>&1"

      - name: Verify HEAD
        run: |
          ssh -i ~/.ssh/id_ed25519_droplet \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              root@157.230.91.33 \
              "cd /opt/prediction-market-bot && echo '--- VPS HEAD ---' && git log -1 --oneline"
