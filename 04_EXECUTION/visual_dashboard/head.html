<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Dashboard — Prediction Market Bot</title>
<style>
/* ============================================================
   TOKENS — validated data-viz palette (3 categorical slots,
   all-pairs PASS in both modes; status palette fixed)
   ============================================================ */
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed; --surface-3:#e9e8e2;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --hair:rgba(11,11,11,.10); --hair-2:rgba(11,11,11,.06);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --up:#006300;
  --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-550:#1c5cab; --seq-700:#0d366b;
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 8px 24px -12px rgba(11,11,11,.12);
  --r:10px; --r-sm:6px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:where(:not([data-theme="light"])){
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#222221; --surface-3:#2c2c2a;
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10); --hair-2:rgba(255,255,255,.06);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --up:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#222221; --surface-3:#2c2c2a;
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10); --hair-2:rgba(255,255,255,.06);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --up:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:84px}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.011em; line-height:1.25}
p{margin:0 0 .7em}
a{color:inherit}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- SHELL ---------- */
.shell{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh}

.rail{
  position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
  background:var(--surface); border-right:1px solid var(--hair);
  padding:20px 0 40px; display:flex; flex-direction:column;
}
.brand{padding:4px 20px 18px; border-bottom:1px solid var(--hair-2); margin-bottom:14px}
.brand .mark{
  display:flex; align-items:center; gap:9px; margin-bottom:9px;
}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--s1);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--s1) 22%, transparent)}
.brand h1{font-size:14px; letter-spacing:-.01em}
.brand .sub{font-size:11.5px; color:var(--ink-3); line-height:1.4}

.navgroup{padding:0 12px; margin-bottom:12px}
.navgroup .lbl{
  font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); padding:0 8px; margin:14px 0 6px;
}
.rail a.nv{
  display:flex; align-items:center; gap:9px; padding:6.5px 8px; border-radius:var(--r-sm);
  font-size:13.2px; color:var(--ink-2); text-decoration:none; transition:background .12s, color .12s;
}
.rail a.nv:hover{background:var(--surface-2); color:var(--ink)}
.rail a.nv.on{background:var(--surface-3); color:var(--ink); font-weight:550}
.rail a.nv .ic{width:15px; flex:0 0 15px; opacity:.75; display:grid; place-items:center}
.rail a.nv .ct{margin-left:auto; font-size:10.5px; color:var(--ink-3); font-family:var(--mono)}

.main{min-width:0}
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--plane) 86%, transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--hair); padding:11px 30px;
  display:flex; align-items:center; gap:14px;
}
.topbar .crumb{font-size:12.5px; color:var(--ink-3)}
.topbar .crumb b{color:var(--ink-2); font-weight:550}
.spacer{flex:1}
.btn{
  appearance:none; border:1px solid var(--hair); background:var(--surface); color:var(--ink-2);
  font:inherit; font-size:12.5px; padding:5px 11px; border-radius:var(--r-sm); cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2); color:var(--ink)}
.btn.sm{font-size:11.5px; padding:3.5px 9px}

.wrap{padding:30px 30px 96px; max-width:1360px}
section{margin-bottom:46px; scroll-margin-top:84px}
.sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:6px; flex-wrap:wrap}
.sechead h2{font-size:19px}
.sechead .num{
  font-family:var(--mono); font-size:11px; color:var(--ink-3);
  border:1px solid var(--hair); padding:1px 6px; border-radius:4px;
}
.lede{color:var(--ink-2); font-size:13.8px; max-width:78ch; margin-bottom:18px}
.lede strong{color:var(--ink); font-weight:600}

/* ---------- CARDS ---------- */
.card{
  min-width:0; max-width:100%;
  background:var(--surface); border:1px solid var(--hair); border-radius:var(--r);
  padding:18px 20px; box-shadow:var(--shadow);
}
.card h3{font-size:13.5px; margin-bottom:3px}
.card .cap{font-size:11.5px; color:var(--ink-3); margin-bottom:14px; line-height:1.45}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1080px){ .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:720px){ .g2,.g3,.g4{grid-template-columns:1fr} }

/* ---------- STAT TILES ---------- */
.tile{
  background:var(--surface); border:1px solid var(--hair); border-radius:var(--r);
  padding:15px 17px; position:relative; overflow:hidden;
}
.tile::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2.5px; background:var(--accent,var(--axis))}
.tile .k{font-size:10.5px; font-weight:650; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3)}
.tile .v{font-size:31px; font-weight:620; letter-spacing:-.025em; line-height:1.1; margin:5px 0 2px}
.tile .v small{font-size:14px; font-weight:500; color:var(--ink-3); letter-spacing:0}
.tile .n{font-size:11.8px; color:var(--ink-2); line-height:1.4}

/* ---------- CHIPS ---------- */
.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
  padding:2px 7px 2px 6px; border-radius:20px; border:1px solid var(--hair);
  background:var(--surface-2); color:var(--ink-2); white-space:nowrap; letter-spacing:.01em;
}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor; flex:0 0 6px}
.chip.good{color:var(--good); border-color:color-mix(in srgb,var(--good) 32%,transparent); background:color-mix(in srgb,var(--good) 11%,transparent)}
.chip.warn{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 34%,transparent); background:color-mix(in srgb,var(--warn) 12%,transparent)}
.chip.serious{color:var(--serious); border-color:color-mix(in srgb,var(--serious) 34%,transparent); background:color-mix(in srgb,var(--serious) 12%,transparent)}
.chip.crit{color:var(--crit); border-color:color-mix(in srgb,var(--crit) 34%,transparent); background:color-mix(in srgb,var(--crit) 12%,transparent)}
.chip.info{color:var(--s1); border-color:color-mix(in srgb,var(--s1) 34%,transparent); background:color-mix(in srgb,var(--s1) 11%,transparent)}
.chip.mute{color:var(--ink-3)}

/* ---------- HERO ---------- */
.hero{
  border:1px solid var(--hair); border-radius:14px; padding:26px 28px; margin-bottom:26px;
  background:
    radial-gradient(900px 300px at 8% -30%, color-mix(in srgb,var(--s1) 13%,transparent), transparent 70%),
    radial-gradient(700px 280px at 92% -20%, color-mix(in srgb,var(--crit) 9%,transparent), transparent 70%),
    var(--surface);
  box-shadow:var(--shadow);
}
.hero .eyebrow{font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:9px}
.hero h2{font-size:25px; letter-spacing:-.02em; margin-bottom:10px; max-width:30ch}
.hero p{color:var(--ink-2); font-size:14px; max-width:82ch}
.hero .meta{display:flex; gap:9px; flex-wrap:wrap; margin-top:16px; padding-top:15px; border-top:1px solid var(--hair-2)}

/* ---------- TABLES ---------- */
table{border-collapse:collapse; width:100%; font-size:12.8px}
th{
  text-align:left; font-size:10.3px; font-weight:700; letter-spacing:.075em; text-transform:uppercase;
  color:var(--ink-3); padding:0 10px 7px; border-bottom:1px solid var(--hair); white-space:nowrap;
}
td{padding:8.5px 10px; border-bottom:1px solid var(--hair-2); vertical-align:top; color:var(--ink-2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
td.k{color:var(--ink); font-weight:550}
td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.tscroll{overflow-x:auto; margin:0 -20px; padding:0 20px; max-width:calc(100% + 40px)}

/* ---------- CELL MATRIX ---------- */
.mx{overflow-x:auto; padding-bottom:4px; max-width:100%; min-width:0; contain:paint}
.mx table{border-collapse:separate; border-spacing:2px; width:auto; min-width:100%}
.mx th.b{
  font-size:9.2px; letter-spacing:.03em; padding:0 0 8px; text-align:center;
  writing-mode:vertical-rl; transform:rotate(180deg); height:92px; border:none; color:var(--ink-3);
}
.mx th.m{
  text-align:right; padding:0 10px 0 0; font-size:10.8px; text-transform:none; letter-spacing:0;
  font-weight:550; color:var(--ink-2); border:none; white-space:nowrap; position:sticky; left:0;
  background:var(--surface); z-index:2;
}
.mx td{padding:0; border:none; background:transparent}
.cellbox{
  width:26px; height:26px; border-radius:5px; background:var(--surface-3);
  border:1px solid transparent; cursor:default; position:relative;
  display:grid; place-items:center; transition:transform .1s, box-shadow .1s;
}
.cellbox[data-s]:hover{transform:scale(1.22); z-index:5; box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cellbox.none{background:transparent; border:1px dashed var(--hair-2)}
.cellbox.act{background:#8a5cd6; box-shadow:0 0 0 3px color-mix(in srgb,#8a5cd6 22%,transparent)}
.cellbox.win{background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 20%,transparent)}
.cellbox.ro{background:repeating-linear-gradient(135deg,var(--crit) 0 3px,var(--surface-3) 3px 6px)}
.cellbox.unm{background:var(--warn); border:1px dashed var(--ink)}
.cellbox.blk{background:var(--crit)}
.cellbox.dark{background:var(--surface-3); border:1px solid var(--axis)}
.cellbox.ni{background:color-mix(in srgb,var(--s1) 17%,var(--surface-2))}
.cellbox.mis{background:var(--warn)}
.cellbox .g{font-size:9px; font-weight:800; color:#0b0b0b; opacity:.72}
.mxleg{display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; font-size:11.5px; color:var(--ink-2)}
.mxleg span{display:inline-flex; align-items:center; gap:6px}
.mxleg b{width:11px; height:11px; border-radius:3px; display:inline-block}

/* ---------- FOREST PLOT ---------- */
.forest{width:100%; display:block; overflow:visible}
.fz{stroke:var(--axis); stroke-width:1.5; stroke-dasharray:3 3}
.fgrid{stroke:var(--grid); stroke-width:1}
.frow:hover .fbg{fill:var(--surface-2)}
.flabel{font-size:11.6px; fill:var(--ink); font-weight:550}
.fsub{font-size:10.2px; fill:var(--ink-3)}
.ftick{font-size:10px; fill:var(--ink-3); font-family:var(--mono)}
.fci{stroke-width:2; stroke-linecap:round}
.fpt{stroke:var(--surface); stroke-width:2}

/* ---------- TIMELINE ---------- */
.tl{position:relative; padding-left:26px}
.tl::before{content:""; position:absolute; left:6.5px; top:6px; bottom:6px; width:1.5px; background:var(--grid)}
.tlitem{position:relative; padding:0 0 18px}
.tlitem::before{
  content:""; position:absolute; left:-24px; top:5px; width:9px; height:9px; border-radius:50%;
  background:var(--surface); border:2px solid var(--axis);
}
.tlitem.hit::before{border-color:var(--good); background:var(--good)}
.tlitem.neg::before{border-color:var(--crit); background:var(--crit)}
.tlitem.now::before{border-color:var(--s1); background:var(--s1); box-shadow:0 0 0 4px color-mix(in srgb,var(--s1) 22%,transparent)}
.tlitem .th{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:3px}
.tlitem .tw{font-size:13px; font-weight:620; color:var(--ink)}
.tlitem .td{font-size:12.4px; color:var(--ink-2); max-width:88ch}

/* ---------- BARS ---------- */
.bars{display:flex; flex-direction:column; gap:9px}
.bar{display:grid; grid-template-columns:96px minmax(0,1fr) 46px; align-items:center; gap:11px}
.bar .bl{font-size:11.6px; color:var(--ink-2); text-align:right}
.bar .bt{height:15px; background:var(--surface-2); border-radius:3px; overflow:hidden; position:relative}
.bar .bf{height:100%; border-radius:3px; min-width:2px}
.bar .bv{font-size:11.8px; font-family:var(--mono); color:var(--ink); text-align:right}

/* ---------- PIPELINE ---------- */
.pipe{display:flex; gap:0; overflow-x:auto; padding:4px 0 10px}
.pnode{
  flex:1 0 auto; min-width:120px; background:var(--surface-2); border:1px solid var(--hair);
  padding:11px 13px; position:relative; margin-right:12px; border-radius:var(--r-sm);
}
.pnode:last-child{margin-right:0}
.pnode::after{
  content:""; position:absolute; right:-12px; top:50%; width:12px; height:1.5px; background:var(--axis);
}
.pnode:last-child::after{display:none}
.pnode .pc{font-family:var(--mono); font-size:10px; color:var(--ink-3); letter-spacing:.05em}
.pnode .pn{font-size:12.3px; font-weight:600; color:var(--ink); margin:2px 0 4px}
.pnode .ps{font-size:10.8px; color:var(--ink-3); line-height:1.35}
.pnode.hot{border-color:color-mix(in srgb,var(--warn) 45%,transparent); background:color-mix(in srgb,var(--warn) 8%,var(--surface-2))}

/* ---------- DECISION DESK ---------- */
.dk{display:flex; flex-direction:column; gap:10px}
.dkrow{
  display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,2fr) auto; gap:16px; align-items:start;
  background:var(--surface); border:1px solid var(--hair); border-left:3px solid var(--accent,var(--axis));
  border-radius:var(--r-sm); padding:13px 16px;
}
.dkrow .dt{font-size:13px; font-weight:620; color:var(--ink); margin-bottom:3px}
.dkrow .dd{font-size:12.2px; color:var(--ink-2)}
.dkrow .dc{font-size:11.4px; color:var(--ink-3); text-align:right; white-space:nowrap}
@media(max-width:860px){ .dkrow{grid-template-columns:1fr} .dkrow .dc{text-align:left} }

/* ---------- MISC ---------- */
.note{
  border-left:2.5px solid var(--s1); background:color-mix(in srgb,var(--s1) 7%,transparent);
  padding:11px 15px; border-radius:0 var(--r-sm) var(--r-sm) 0; font-size:12.6px; color:var(--ink-2);
}
.note.bad{border-color:var(--crit); background:color-mix(in srgb,var(--crit) 8%,transparent)}
.note.warn{border-color:var(--warn); background:color-mix(in srgb,var(--warn) 9%,transparent)}
.note b{color:var(--ink)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:12.4px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0; color:var(--ink); font-family:var(--mono); font-variant-numeric:tabular-nums}
.tt{
  position:fixed; pointer-events:none; opacity:0; z-index:100; max-width:290px;
  background:var(--surface); border:1px solid var(--hair); border-radius:var(--r-sm);
  padding:9px 12px; font-size:12px; color:var(--ink-2); box-shadow:0 8px 28px rgba(0,0,0,.35);
  transition:opacity .1s;
}
.tt .h{font-weight:650; color:var(--ink); font-size:12.4px; margin-bottom:3px}
.tt .r{display:flex; justify-content:space-between; gap:16px; font-family:var(--mono); font-size:11.4px}
.hidden{display:none !important}
.srch{
  width:100%; max-width:280px; font:inherit; font-size:12.6px; padding:6px 11px;
  border:1px solid var(--hair); border-radius:var(--r-sm); background:var(--surface-2); color:var(--ink);
}
.srch::placeholder{color:var(--ink-3)}
.toolbar{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
footer{border-top:1px solid var(--hair); padding:22px 30px 40px; color:var(--ink-3); font-size:11.8px; max-width:1360px}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static; height:auto; border-right:none; border-bottom:1px solid var(--hair)}
  .wrap,.topbar,footer{padding-left:16px; padding-right:16px}
}
@media print{ .rail,.topbar{display:none} body{background:#fff} }
</style>
